<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AzChat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--s1:#13131a;--s2:#1c1c27;--s3:#242436;--border:#2a2a3a;--accent:#6c63ff;--a2:#ff6584;--a3:#43e97b;--text:#e8e8f0;--muted:#6b6b8a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* SCREENS */
.screen{display:none;height:100vh;}
.screen.active{display:flex;}

/* ── AUTH ── */
#authScreen{align-items:center;justify-content:center;flex-direction:column;}
#authScreen::before{content:'';position:fixed;top:-150px;left:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(108,99,255,.09) 0%,transparent 70%);pointer-events:none;}
.auth-card{background:var(--s1);border:1px solid var(--border);border-radius:24px;padding:36px 28px;width:min(340px,92vw);position:relative;overflow:hidden;animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--a2),var(--a3));}
.auth-logo{font-family:'Syne',sans-serif;font-size:42px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px;text-align:center;margin-bottom:4px;}
.auth-sub{color:var(--muted);font-size:12px;text-align:center;margin-bottom:24px;}
.auth-tabs{display:flex;gap:4px;background:var(--s2);border-radius:12px;padding:4px;margin-bottom:22px;}
.auth-tab{flex:1;padding:8px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
.auth-tab.active{background:var(--accent);color:#fff;font-weight:500;}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.inp{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:12px;transition:border-color .2s;}
.inp:focus{border-color:var(--accent);}
.inp::placeholder{color:var(--muted);}
.av-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
.av-opt{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:2px solid transparent;background:var(--s2);transition:all .2s;}
.av-opt:hover{transform:scale(1.1);}
.av-opt.sel{border-color:var(--accent);box-shadow:0 0 12px rgba(108,99,255,.4);}
.auth-btn{width:100%;background:linear-gradient(135deg,var(--accent),#9b59ff);border:none;border-radius:12px;padding:14px;color:#fff;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px;}
.auth-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,99,255,.4);}
.auth-btn:disabled{opacity:.6;transform:none;cursor:not-allowed;}
.auth-err{color:var(--a2);font-size:12px;text-align:center;margin-bottom:10px;min-height:16px;}

/* ── MAIN ── */
#mainScreen{flex-direction:row;}

/* SIDEBAR */
.sidebar{width:240px;min-width:240px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .28s ease;z-index:100;}
.sb-head{padding:14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.sb-logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sb-me{display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
.sb-av{width:30px;height:30px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--accent);flex-shrink:0;}
.sb-nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.logout-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px;border-radius:6px;transition:color .2s;flex-shrink:0;}
.logout-btn:hover{color:var(--a2);}
.sb-sec{padding:10px 14px 4px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.sb-list{flex:1;overflow-y:auto;padding:2px 0 8px;}
.sb-list::-webkit-scrollbar{width:3px;}
.sb-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.ci{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;border-radius:10px;margin:1px 6px;transition:background .15s;position:relative;}
.ci:hover{background:var(--s2);}
.ci.active{background:var(--s3);}
.ci-av{width:34px;height:34px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative;}
.ci-av .onl{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--a3);border:2px solid var(--s1);bottom:0;right:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-prev{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.unread{background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 6px;min-width:18px;text-align:center;flex-shrink:0;}

/* CHAT AREA */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
.topbar{display:flex;align-items:center;gap:10px;padding:11px 14px;background:rgba(19,19,26,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;}
.menu-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px;display:block;}
.tb-av{width:32px;height:32px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.tb-info{flex:1;}
.tb-name{font-size:13px;font-weight:600;}
.tb-status{font-size:11px;color:var(--a3);}
.online-pill{display:flex;align-items:center;gap:5px;background:rgba(67,233,123,.1);border:1px solid rgba(67,233,123,.2);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--a3);}
.onl-dot{width:5px;height:5px;border-radius:50%;background:var(--a3);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#messages{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;}
#messages::-webkit-scrollbar{width:3px;}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.msg-row{display:flex;align-items:flex-end;gap:6px;animation:mIn .2s ease;margin-bottom:1px;}
@keyframes mIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg-row.own{flex-direction:row-reverse;}
.m-av{width:24px;height:24px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.m-av.hide{visibility:hidden;}
.m-body{display:flex;flex-direction:column;max-width:74%;}
.msg-row.own .m-body{align-items:flex-end;}
.m-name{font-size:10px;color:var(--muted);margin-bottom:2px;padding:0 4px;font-weight:500;}
.m-bub{padding:8px 12px;border-radius:15px;font-size:13px;line-height:1.5;word-break:break-word;}
.msg-row:not(.own) .m-bub{background:var(--s2);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg-row.own .m-bub{background:linear-gradient(135deg,var(--accent),#9b59ff);border-bottom-right-radius:4px;color:#fff;}
.m-time{font-size:10px;opacity:.4;margin-top:2px;padding:0 4px;}
.sys{text-align:center;font-size:11px;color:var(--muted);padding:5px 0;display:flex;align-items:center;gap:8px;margin:3px 0;}
.sys::before,.sys::after{content:'';flex:1;height:1px;background:var(--border);}
#typingBar{padding:3px 14px;font-size:11px;color:var(--muted);font-style:italic;min-height:20px;flex-shrink:0;}
.dots span{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--muted);margin:0 1px;animation:dt 1.2s infinite;}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}

.ibar{padding:9px 10px;background:rgba(19,19,26,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:7px;align-items:center;flex-shrink:0;position:relative;}
#msgInput{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .2s;}
#msgInput:focus{border-color:var(--accent);}
#msgInput::placeholder{color:var(--muted);}
.ic-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0;}
.em-btn{background:var(--s2);border:1px solid var(--border);}
.em-btn:hover{background:var(--border);}
.sd-btn{background:linear-gradient(135deg,var(--accent),#9b59ff);color:#fff;}
.sd-btn:hover{transform:scale(1.08);box-shadow:0 4px 14px rgba(108,99,255,.4);}
.epanel{position:absolute;bottom:55px;left:10px;background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:9px;display:none;flex-wrap:wrap;gap:3px;width:208px;z-index:50;box-shadow:0 8px 28px rgba(0,0,0,.5);}
.epanel.show{display:flex;}
.ep{font-size:19px;cursor:pointer;padding:3px;border-radius:7px;background:none;border:none;transition:background .15s;}
.ep:hover{background:var(--s2);}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;}
.empty-ico{font-size:48px;opacity:.3;}
.empty-txt{font-size:13px;opacity:.5;}

.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:24px auto;}
@keyframes spin{to{transform:rotate(360deg)}}

/* MOBILE */
@media(max-width:780px){
  .sidebar{position:absolute;top:0;left:0;height:100%;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:block;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;}
  .overlay.show{display:block;}
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen" class="screen active">
  <div class="auth-card">
    <div class="auth-logo">AzChat</div>
    <div class="auth-sub">İstənilən cihazdan real vaxtda mesajlaş</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Giriş</button>
      <button class="auth-tab" onclick="switchTab('register')">Qeydiyyat</button>
    </div>
    <div class="auth-err" id="authErr"></div>

    <!-- LOGIN -->
    <div id="loginForm">
      <div class="lbl">Email</div>
      <input class="inp" id="loginEmail" type="email" placeholder="email@example.com"/>
      <div class="lbl">Parol</div>
      <input class="inp" id="loginPass" type="password" placeholder="••••••••"/>
      <button class="auth-btn" id="loginBtn" onclick="doLogin()">Daxil ol →</button>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" style="display:none">
      <div class="lbl">Adın</div>
      <input class="inp" id="regName" placeholder="Adını daxil et..." maxlength="20"/>
      <div class="lbl">Email</div>
      <input class="inp" id="regEmail" type="email" placeholder="email@example.com"/>
      <div class="lbl">Parol</div>
      <input class="inp" id="regPass" type="password" placeholder="Min. 6 simvol"/>
      <div class="lbl">Avatarın</div>
      <div class="av-row" id="avPicker"></div>
      <button class="auth-btn" id="regBtn" onclick="doRegister()">Qeydiyyatdan keç →</button>
    </div>
  </div>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen" class="screen">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">AzChat</div>
      <div class="sb-me">
        <div class="sb-av" id="sbAv"></div>
        <div class="sb-nm" id="sbNm"></div>
      </div>
      <button class="logout-btn" onclick="doLogout()" title="Çıxış">⏻</button>
    </div>

    <div class="sb-sec">💬 Ümumi Chat</div>
    <div class="ci active" id="publicRoomBtn" onclick="openPublic()">
      <div class="ci-av">🌐</div>
      <div class="ci-info">
        <div class="ci-name">Ümumi</div>
        <div class="ci-prev" id="publicPreview">Hamı üçün açıq</div>
      </div>
      <div class="unread" id="publicUnread" style="display:none"></div>
    </div>

    <div class="sb-sec">👥 İstifadəçilər</div>
    <div class="sb-list" id="usersList"></div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="tb-av" id="tbAv">🌐</div>
      <div class="tb-info">
        <div class="tb-name" id="tbName">Ümumi Chat</div>
        <div class="tb-status" id="tbStatus">Yüklənir...</div>
      </div>
      <div class="online-pill" id="onlinePill">
        <div class="onl-dot"></div>
        <span id="onlineCount">0</span>
      </div>
    </div>

    <div id="messages"><div class="spin"></div></div>
    <div id="typingBar"></div>

    <div class="ibar">
      <div class="epanel" id="epanel"></div>
      <button class="ic-btn em-btn" onclick="toggleEmoji()">😊</button>
      <input id="msgInput" placeholder="Mesaj yaz..." autocomplete="off"
        onkeydown="onKey(event)" oninput="onTyping()"/>
      <button class="ic-btn sd-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getDatabase, ref, push, onValue, set, remove,
  onDisconnect, serverTimestamp, query, limitToLast, off, get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const cfg = {
  apiKey:"AIzaSyD4S4QSpeeSrdC57XgVk_bQ9KIt979o5ys",
  authDomain:"aze-chat-f2cce.firebaseapp.com",
  projectId:"aze-chat-f2cce",
  storageBucket:"aze-chat-f2cce.firebasestorage.app",
  messagingSenderId:"633374657254",
  appId:"1:633374657254:web:52974c4757578bdc154927",
  databaseURL:"https://aze-chat-f2cce-default-rtdb.firebaseio.com"
};
const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getDatabase(app);

const AVATARS=['😎','🐱','🦊','🐸','🦁','🐼','🤖','👾','🦋','🌟','🔥','💎'];
const EMOJIS=['😀','😂','😍','🥰','😎','🤔','😅','🙈','👍','❤️','🔥','✨','🎉','😭','🤣','💀','🫡','🙏','👀','💪','🎯','🚀','💯','🥳'];

let me = null; // {uid, name, avatar, email}
let currentRoom = 'public';
let currentDMUser = null;
let onlineUsers = {};
let typingTimer = null;
let isTyping = false;
let lastSender = null;
let msgListeners = [];
let selAvatar = AVATARS[0];

// ── Avatar Picker ──
const avPicker = document.getElementById('avPicker');
AVATARS.forEach((a,i) => {
  const d = document.createElement('div');
  d.className='av-opt'+(i===0?' sel':'');
  d.textContent=a;
  d.onclick=()=>{
    document.querySelectorAll('.av-opt').forEach(x=>x.classList.remove('sel'));
    d.classList.add('sel'); selAvatar=a;
  };
  avPicker.appendChild(d);
});

// ── Emoji Panel ──
const epanel = document.getElementById('epanel');
EMOJIS.forEach(e=>{
  const b=document.createElement('button');
  b.className='ep'; b.textContent=e;
  b.onclick=()=>{ document.getElementById('msgInput').value+=e; document.getElementById('msgInput').focus(); };
  epanel.appendChild(b);
});
window.toggleEmoji=()=>epanel.classList.toggle('show');
document.addEventListener('click',e=>{
  if(!e.target.closest('.em-btn')&&!e.target.closest('.epanel')) epanel.classList.remove('show');
  if(!e.target.closest('.sidebar')&&!e.target.closest('.menu-btn')) closeSidebar();
});

// ── Auth Tab Switch ──
window.switchTab=(t)=>{
  document.getElementById('loginForm').style.display=t==='login'?'block':'none';
  document.getElementById('registerForm').style.display=t==='register'?'block':'none';
  document.querySelectorAll('.auth-tab').forEach((x,i)=>x.classList.toggle('active',(t==='login'&&i===0)||(t==='register'&&i===1)));
  document.getElementById('authErr').textContent='';
};

// ── Register ──
window.doRegister=async()=>{
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPass').value;
  const errEl=document.getElementById('authErr');
  if(!name){errEl.textContent='Ad lazımdır!';return;}
  if(!email){errEl.textContent='Email lazımdır!';return;}
  if(pass.length<6){errEl.textContent='Parol min. 6 simvol olmalıdır!';return;}
  const btn=document.getElementById('regBtn');
  btn.disabled=true; btn.textContent='Yüklənir...';
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:`${name}||${selAvatar}`});
    errEl.textContent='';
  }catch(e){
    errEl.textContent=friendlyErr(e.code);
    btn.disabled=false; btn.textContent='Qeydiyyatdan keç →';
  }
};

// ── Login ──
window.doLogin=async()=>{
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('authErr');
  if(!email||!pass){errEl.textContent='Email və parol lazımdır!';return;}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='Yüklənir...';
  try{
    await signInWithEmailAndPassword(auth,email,pass);
    errEl.textContent='';
  }catch(e){
    errEl.textContent=friendlyErr(e.code);
    btn.disabled=false; btn.textContent='Daxil ol →';
  }
};

// ── Logout ──
window.doLogout=async()=>{
  if(me) await remove(ref(db,`presence/${me.uid}`));
  await signOut(auth);
};

// ── Auth State ──
onAuthStateChanged(auth, async user=>{
  if(user){
    const parts=(user.displayName||'İstifadəçi||😎').split('||');
    me={uid:user.uid,name:parts[0]||'İstifadəçi',avatar:parts[1]||'😎',email:user.email};
    document.getElementById('authScreen').classList.remove('active');
    document.getElementById('mainScreen').classList.add('active');
    document.getElementById('sbAv').textContent=me.avatar;
    document.getElementById('sbNm').textContent=me.name;
    await initPresence();
    listenUsers();
    openPublic();
  } else {
    document.getElementById('mainScreen').classList.remove('active');
    document.getElementById('authScreen').classList.add('active');
    document.getElementById('loginBtn').disabled=false;
    document.getElementById('loginBtn').textContent='Daxil ol →';
    me=null; onlineUsers={};
  }
});

// ── Presence ──
async function initPresence(){
  const pRef=ref(db,`presence/${me.uid}`);
  await set(pRef,{name:me.name,avatar:me.avatar,uid:me.uid,online:true,ts:serverTimestamp()});
  onDisconnect(pRef).remove();
}

// ── Listen Users ──
function listenUsers(){
  onValue(ref(db,'presence'),snap=>{
    onlineUsers={};
    const data=snap.val()||{};
    Object.values(data).forEach(u=>{ if(u.uid!==me.uid) onlineUsers[u.uid]=u; });
    const count=Object.keys(data).length;
    document.getElementById('onlineCount').textContent=count;
    renderUsersList();
  });
}

function renderUsersList(){
  const list=document.getElementById('usersList');
  list.innerHTML='';
  Object.values(onlineUsers).forEach(u=>{
    const d=document.createElement('div');
    d.className='ci'+(currentRoom==='dm'&&currentDMUser?.uid===u.uid?' active':'');
    d.innerHTML=`<div class="ci-av"><span>${u.avatar}</span><span class="onl"></span></div><div class="ci-info"><div class="ci-name">${u.name}</div><div class="ci-prev">Onlayn</div></div>`;
    d.onclick=()=>openDM(u);
    list.appendChild(d);
  });
}

// ── Open Public ──
window.openPublic=()=>{
  currentRoom='public'; currentDMUser=null;
  document.getElementById('tbAv').textContent='🌐';
  document.getElementById('tbName').textContent='Ümumi Chat';
  document.getElementById('tbStatus').textContent='Hamı üçün açıq';
  document.getElementById('publicRoomBtn').classList.add('active');
  renderUsersList();
  closeSidebar();
  loadMessages('public');
};

// ── Open DM ──
window.openDM=(u)=>{
  currentRoom='dm'; currentDMUser=u;
  document.getElementById('tbAv').textContent=u.avatar;
  document.getElementById('tbName').textContent=u.name;
  document.getElementById('tbStatus').textContent='Şəxsi mesaj';
  document.getElementById('publicRoomBtn').classList.remove('active');
  renderUsersList();
  closeSidebar();
  const roomId=[me.uid,u.uid].sort().join('_');
  loadMessages('dm_'+roomId);
};

// ── Load Messages ──
function loadMessages(room){
  lastSender=null;
  const msgEl=document.getElementById('messages');
  msgEl.innerHTML='<div class="spin"></div>';
  msgListeners.forEach(u=>u()); msgListeners=[];
  const q=query(ref(db,`messages/${room}`),limitToLast(80));
  let first=true;
  const unsub=onValue(q,snap=>{
    if(first){
      first=false; msgEl.innerHTML='';
      const data=snap.val();
      if(!data){ msgEl.innerHTML='<div class="empty"><div class="empty-ico">💬</div><div class="empty-txt">Hələ mesaj yoxdur</div></div>'; return; }
      Object.values(data).forEach(m=>appendMsg(m,m.uid===me.uid,true));
      scrollBot();
      return;
    }
    const data=snap.val(); if(!data) return;
    const arr=Object.values(data);
    const last=arr[arr.length-1];
    if(last&&last.uid!==me.uid){
      const empty=msgEl.querySelector('.empty');
      if(empty) empty.remove();
      appendMsg(last,false,false);
      scrollBot();
    }
  });
  msgListeners.push(unsub);

  // Typing
  const tRef=ref(db,`typing/${room}`);
  const tUnsub=onValue(tRef,snap=>{
    const data=snap.val()||{};
    const others=Object.entries(data).filter(([id])=>id!==me.uid);
    const tb=document.getElementById('typingBar');
    if(!others.length){tb.innerHTML='';return;}
    const names=others.map(([,v])=>`${v.avatar} ${v.name}`).join(', ');
    tb.innerHTML=`<span>${names} yazır </span><span class="dots"><span></span><span></span><span></span></span>`;
  });
  msgListeners.push(tUnsub);
}

// ── Send ──
window.sendMsg=async()=>{
  const inp=document.getElementById('msgInput');
  const text=inp.value.trim(); if(!text) return;
  const room=currentRoom==='public'?'public':['dm',me.uid,currentDMUser.uid].sort().join('_').replace('dm_','dm_');
  const roomKey=currentRoom==='public'?'public':[me.uid,currentDMUser.uid].sort().join('_');
  const time=new Date().toLocaleTimeString('az',{hour:'2-digit',minute:'2-digit'});
  const msg={uid:me.uid,name:me.name,avatar:me.avatar,text,time,ts:serverTimestamp()};
  await push(ref(db,`messages/${currentRoom==='public'?'public':'dm_'+roomKey}`),msg);
  const empty=document.getElementById('messages').querySelector('.empty');
  if(empty) empty.remove();
  appendMsg({...msg},true,false);
  scrollBot();
  inp.value='';
  isTyping=false;
  const tRoom=currentRoom==='public'?'public':'dm_'+roomKey;
  await remove(ref(db,`typing/${tRoom}/${me.uid}`));
  epanel.classList.remove('show');
};

window.onKey=e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();window.sendMsg();} };

window.onTyping=async()=>{
  const roomKey=currentRoom==='public'?'public':[me.uid,currentDMUser?.uid].sort().join('_');
  const tRoom=currentRoom==='public'?'public':'dm_'+roomKey;
  if(!isTyping){ isTyping=true; await set(ref(db,`typing/${tRoom}/${me.uid}`),{name:me.name,avatar:me.avatar}); }
  clearTimeout(typingTimer);
  typingTimer=setTimeout(async()=>{ isTyping=false; await remove(ref(db,`typing/${tRoom}/${me.uid}`)); },2500);
};

function appendMsg(msg,isOwn,silent){
  const c=document.getElementById('messages');
  const showName=lastSender!==msg.uid;
  lastSender=msg.uid;
  const row=document.createElement('div');
  row.className='msg-row'+(isOwn?' own':'');
  const av=document.createElement('div');
  av.className='m-av'+(showName?'':' hide');
  av.textContent=msg.avatar;
  const body=document.createElement('div');
  body.className='m-body';
  if(!isOwn&&showName){
    const nm=document.createElement('div');
    nm.className='m-name'; nm.textContent=msg.name;
    body.appendChild(nm);
  }
  const bub=document.createElement('div');
  bub.className='m-bub'; bub.textContent=msg.text;
  const tm=document.createElement('div');
  tm.className='m-time'; tm.textContent=msg.time||'';
  bub.appendChild(tm); body.appendChild(bub);
  if(isOwn){row.appendChild(body);row.appendChild(av);}
  else{row.appendChild(av);row.appendChild(body);}
  c.appendChild(row);
  if(!silent) scrollBot();
}

function scrollBot(){ const c=document.getElementById('messages'); c.scrollTop=c.scrollHeight; }

// ── Sidebar ──
window.toggleSidebar=()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
};
window.closeSidebar=()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
};

// ── Error messages ──
function friendlyErr(code){
  const m={'auth/email-already-in-use':'Bu email artıq istifadə olunub','auth/invalid-email':'Email düzgün deyil','auth/wrong-password':'Parol yanlışdır','auth/user-not-found':'İstifadəçi tapılmadı','auth/weak-password':'Parol çox sadədir','auth/invalid-credential':'Email və ya parol yanlışdır'};
  return m[code]||'Xəta baş verdi, yenidən cəhd et';
}

// Enter on auth inputs
['loginEmail','loginPass'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter') window.doLogin(); }));
['regName','regEmail','regPass'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter') window.doRegister(); }));
</script>
